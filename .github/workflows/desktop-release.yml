name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21 (with jpackage)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Linux: tools needed by jpackage for deb/rpm/AppImage
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm libfuse2

      # Windows: WiX is required by jpackage for .msi
      - name: Install WiX
        if: runner.os == 'Windows'
        run: choco install wixtoolset -y

      - name: Build distributable + native installer (Linux portable + rpm)
        if: runner.os == 'Linux'
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:createDistributable :composeApp:packageRpm --console=plain
        shell: bash

      - name: Build distributable + native installer (Windows)
        if: runner.os != 'Linux'
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:createDistributable :composeApp:packageDistributionForCurrentOS --console=plain
        shell: bash

      - name: Upload portable
        uses: actions/upload-artifact@v5
        with:
          name: YapYap-portable-${{ runner.os }}
          path: composeApp/build/compose/binaries/main/app/**
          if-no-files-found: warn

      - name: Upload Linux installer (rpm)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: YapYap-installer-Linux-rpm
          path: composeApp/build/compose/binaries/main/rpm/**
          if-no-files-found: warn

      - name: Upload Windows installer (msi/exe)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: YapYap-installer-Windows
          path: |
            composeApp/build/compose/binaries/main/msi/**
            composeApp/build/compose/binaries/main/exe/**
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Zip portables (installers stay straight)
        run: |
          ls -R dist
          cd dist
          for d in YapYap-portable-*; do
            [ -d "$d" ] && zip -r "$d.zip" "$d"
          done
          ls -lh *.zip */*.rpm */*.msi */*.exe 2>/dev/null || true
        shell: bash

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/YapYap-installer-Linux-rpm/**/*.rpm
            dist/YapYap-installer-Windows/**/*.msi
            dist/YapYap-installer-Windows/**/*.exe
          generate_release_notes: true
